<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Session Free Sample</title>
  <link rel="stylesheet" href="./src/app.css">
</head>
<body>
  <div class="header">
    <h1>AI Session Free <span>v0.1</span></h1>
    <div class="session-status-bar" id="session-status-bar">
      <div class="session-badges" id="session-badges"></div>
      <button class="btn-check-session" id="btn-check-session" title="Check browser sessions">🔄 Check Sessions</button>
    </div>
  </div>

  <div class="input-area">
    <div class="provider-toggles">
      <label class="provider-toggle" data-provider="chatgpt">
        <input type="checkbox" id="toggle-chatgpt" checked>
        <span class="dot"></span>
        ChatGPT
      </label>
      <label class="provider-toggle" data-provider="claude">
        <input type="checkbox" id="toggle-claude" checked>
        <span class="dot"></span>
        Claude
      </label>
      <label class="provider-toggle" data-provider="gemini">
        <input type="checkbox" id="toggle-gemini" checked>
        <span class="dot"></span>
        Gemini
      </label>
    </div>
    <div class="prompt-row">
      <textarea id="prompt-input" placeholder="Type your prompt here..." rows="2"></textarea>
      <button class="btn btn-send" id="btn-send">Send</button>
    </div>
  </div>

  <div class="responses" id="responses">
    <div class="response-col" id="col-chatgpt">
      <div class="col-header" data-provider="chatgpt">
        <span class="provider-dot"></span>
        ChatGPT
        <span class="col-status" id="status-chatgpt">idle</span>
      </div>
      <div class="col-body empty" id="body-chatgpt">Waiting for prompt...</div>
    </div>
    <div class="response-col" id="col-claude">
      <div class="col-header" data-provider="claude">
        <span class="provider-dot"></span>
        Claude
        <span class="col-status" id="status-claude">idle</span>
      </div>
      <div class="col-body empty" id="body-claude">Waiting for prompt...</div>
    </div>
    <div class="response-col" id="col-gemini">
      <div class="col-header" data-provider="gemini">
        <span class="provider-dot"></span>
        Gemini
        <span class="col-status" id="status-gemini">idle</span>
      </div>
      <div class="col-body empty" id="body-gemini">Waiting for prompt...</div>
    </div>
  </div>

  <!-- Floating Debug Action Button (FAB) -->
  <button id="btn-debug-fab" class="debug-fab" title="Toggle Run I/O Debug Console">
    <span class="debug-fab-dot"></span>
    🐞 Debug
    <span id="debug-badge" class="debug-badge">0</span>
  </button>

  <!-- Slide-out Debug Overlay Drawer -->
  <div id="debug-drawer" class="debug-drawer">
    <div class="debug-drawer-header">
      <div class="debug-title-area">
        <span class="debug-title">🐞 Run I/O Console</span>
        <label class="switch-wrap">
          <span class="switch">
            <input type="checkbox" id="debug-toggle">
            <span class="switch-slider"></span>
          </span>
          <span id="debug-toggle-status">Debug: OFF</span>
        </label>
      </div>
      <div class="debug-actions">
        <button id="btn-debug-clear" class="btn-action" title="Clear all in-memory logs">Clear</button>
        <button id="btn-debug-download" class="btn-action btn-action-primary" title="Export logs as JSON">Download JSON</button>
        <button id="btn-debug-close" class="btn-close-drawer" title="Close drawer">✕</button>
      </div>
    </div>

    <div class="debug-toolbar">
      <div class="debug-filters">
        <button class="filter-pill active" data-filter="all">All</button>
        <button class="filter-pill" data-filter="chatgpt">ChatGPT</button>
        <button class="filter-pill" data-filter="claude">Claude</button>
        <button class="filter-pill" data-filter="gemini">Gemini</button>
        <button class="filter-pill" data-filter="error">Errors</button>
      </div>
      <div id="debug-stats" class="debug-stat">0 events</div>
    </div>

    <div id="debug-log-list" class="debug-log-list">
      <div class="debug-empty">
        <span>No debug logs captured yet.</span>
        <span>Turn Debug Mode <strong>ON</strong> and send a prompt to inspect live I/O.</span>
      </div>
    </div>
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
