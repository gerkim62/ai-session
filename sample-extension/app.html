<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Session Free Sample</title>
  <style>
    :root {
      --bg-primary: #0f0f13;
      --bg-secondary: #1a1a24;
      --bg-card: #22223a;
      --bg-input: #181828;
      --border: #2d2d4a;
      --text: #e8e8f0;
      --text-dim: #8888a8;
      --accent-chatgpt: #10a37f;
      --accent-claude: #d97706;
      --accent-gemini: #4285f4;
      --accent-chatgpt-bg: rgba(16, 163, 127, 0.08);
      --accent-claude-bg: rgba(217, 119, 6, 0.08);
      --accent-gemini-bg: rgba(66, 133, 244, 0.08);
      --error: #ef4444;
      --radius: 12px;
      --radius-sm: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-primary);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- Header --- */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-secondary);
    }
    .header h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }
    .header h1 span {
      color: var(--text-dim);
      font-weight: 400;
    }

    /* --- Input area --- */
    .input-area {
      padding: 20px 24px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
    }
    .provider-toggles {
      display: flex;
      gap: 12px;
      margin-bottom: 14px;
    }
    .provider-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-card);
      transition: all 0.2s;
      user-select: none;
      font-size: 14px;
    }
    .provider-toggle:hover { border-color: var(--text-dim); }
    .provider-toggle input { display: none; }
    .provider-toggle .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid var(--text-dim);
      transition: all 0.2s;
    }
    .provider-toggle input:checked + .dot {
      border-color: transparent;
    }
    .provider-toggle[data-provider="chatgpt"] input:checked + .dot { background: var(--accent-chatgpt); }
    .provider-toggle[data-provider="claude"] input:checked + .dot { background: var(--accent-claude); }
    .provider-toggle[data-provider="gemini"] input:checked + .dot { background: var(--accent-gemini); }

    .prompt-row {
      display: flex;
      gap: 10px;
    }
    .prompt-row textarea {
      flex: 1;
      resize: vertical;
      min-height: 56px;
      max-height: 200px;
      padding: 14px 16px;
      font-size: 14px;
      font-family: inherit;
      background: var(--bg-input);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      outline: none;
      transition: border-color 0.2s;
    }
    .prompt-row textarea:focus { border-color: var(--text-dim); }
    .prompt-row textarea::placeholder { color: var(--text-dim); }

    .btn {
      padding: 14px 24px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-send {
      background: linear-gradient(135deg, var(--accent-chatgpt), var(--accent-gemini));
      color: #fff;
    }
    .btn-send:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-send:active { transform: translateY(0); }
    .btn-send:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }
    .btn-stop {
      background: var(--error);
      color: #fff;
    }
    .btn-stop:hover { opacity: 0.9; }

    /* --- Response columns --- */
    .responses {
      flex: 1;
      display: flex;
      gap: 1px;
      background: var(--border);
      overflow: hidden;
    }
    .response-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-primary);
      min-width: 0;
    }
    .response-col.hidden { display: none; }

    .col-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .col-header .provider-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .col-header[data-provider="chatgpt"] .provider-dot { background: var(--accent-chatgpt); }
    .col-header[data-provider="claude"] .provider-dot { background: var(--accent-claude); }
    .col-header[data-provider="gemini"] .provider-dot { background: var(--accent-gemini); }

    .col-status {
      margin-left: auto;
      font-size: 11px;
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
      color: var(--text-dim);
    }
    .col-status.loading { color: var(--accent-gemini); }
    .col-status.error { color: var(--error); }
    .col-status.done { color: var(--accent-chatgpt); }

    .col-body {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .col-body.empty {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-style: italic;
    }

    /* --- Loading animation --- */
    @keyframes pulse-dot {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    .loading-dots span {
      animation: pulse-dot 1.4s infinite;
      font-size: 20px;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

    /* --- Scrollbar --- */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
  </style>
</head>
<body>
  <div class="header">
    <h1>AI Session Free <span>v0.1</span></h1>
  </div>

  <div class="input-area">
    <div class="provider-toggles">
      <label class="provider-toggle" data-provider="chatgpt">
        <input type="checkbox" id="toggle-chatgpt" checked>
        <span class="dot"></span>
        ChatGPT
      </label>
      <label class="provider-toggle" data-provider="claude">
        <input type="checkbox" id="toggle-claude" checked>
        <span class="dot"></span>
        Claude
      </label>
      <label class="provider-toggle" data-provider="gemini">
        <input type="checkbox" id="toggle-gemini" checked>
        <span class="dot"></span>
        Gemini
      </label>
    </div>
    <div class="prompt-row">
      <textarea id="prompt-input" placeholder="Type your prompt here..." rows="2"></textarea>
      <button class="btn btn-send" id="btn-send">Send</button>
    </div>
  </div>

  <div class="responses" id="responses">
    <div class="response-col" id="col-chatgpt">
      <div class="col-header" data-provider="chatgpt">
        <span class="provider-dot"></span>
        ChatGPT
        <span class="col-status" id="status-chatgpt">idle</span>
      </div>
      <div class="col-body empty" id="body-chatgpt">Waiting for prompt...</div>
    </div>
    <div class="response-col" id="col-claude">
      <div class="col-header" data-provider="claude">
        <span class="provider-dot"></span>
        Claude
        <span class="col-status" id="status-claude">idle</span>
      </div>
      <div class="col-body empty" id="body-claude">Waiting for prompt...</div>
    </div>
    <div class="response-col" id="col-gemini">
      <div class="col-header" data-provider="gemini">
        <span class="provider-dot"></span>
        Gemini
        <span class="col-status" id="status-gemini">idle</span>
      </div>
      <div class="col-body empty" id="body-gemini">Waiting for prompt...</div>
    </div>
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
